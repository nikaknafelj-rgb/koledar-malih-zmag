<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koledar malih zmag</title>

    <!-- Google Analytics (vstavi svoj ID) -->
    <!--
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background: #faf9f4;
        }

        h1 {
            color: #6d7f4f;
        }

        .hero-image {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }

        .cta {
            margin-top: 30px;
        }

        button {
            background: #7da34d;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #thankyou {
            display: none;
            margin-top: 20px;
            color: #4f6b2f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Koledar malih zmag</h1>

    <p>
        Interaktivni mesečni koledar aktivnosti za otroke.
    </p>

    <img src="koledar.jpg" alt="Koledar malih zmag" class="hero-image">

    <div class="cta">
        <button onclick="interestClick()">
            Zanima me
        </button>

        <div id="thankyou">
            Hvala za vaše zanimanje!
        </div>
    </div>

    <script>
        function interestClick() {
            if (typeof gtag !== "undefined") {
                gtag('event', 'interest_click', {
                    product: 'koledar_malih_zmag'
                });
            }
            document.getElementById("thankyou").style.display = "block";
        }
    </script>

</body>
</html>
